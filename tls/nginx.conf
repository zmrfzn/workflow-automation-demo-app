# HTTPS in front of the controller, for callers outside the VM (Workflow Automation's http.post).
# The certificate is the one Instruqt provisions for wfa-infra.<sandbox>.instruqt.io; track setup
# downloads it to /etc/ssl. Lab commands and tabs keep using plain HTTP on localhost:5001.
server {
    listen 5443 ssl;
    ssl_certificate     /certs/sandbox.crt;
    ssl_certificate_key /certs/sandbox.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://controller:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 240s;
    }
}

name: publish-images

on:
  push:
    branches: [main]
    tags: ["lab-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [v1, v2]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          build-args: RELEASE=${{ matrix.release }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/workflow-automation-app:${{ matrix.release }}

  sidecars:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: controller, context: controller }
          - { name: loadgen, context: loadgen }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/workflow-automation-${{ matrix.name }}:1
